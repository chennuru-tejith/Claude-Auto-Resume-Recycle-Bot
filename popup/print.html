<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChatQueue AI Print Export</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; color: #1f2937; max-width: 800px; margin: 0 auto; }
    h1 { color: #111827; font-size: 24px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 5px; }
    .meta { font-size: 12px; color: #6b7280; margin-bottom: 30px; }
    .msg { border: 1px solid #e5e7eb; border-radius: 8px; padding: 15px; margin-bottom: 15px; page-break-inside: avoid; }
    .msg-human { border-left: 5px solid #d946ef; background: #fdf4ff; }
    .msg-assistant { border-left: 5px solid #3b82f6; background: #f9fafb; }
    .label { font-weight: 700; text-transform: uppercase; font-size: 11px; margin-bottom: 6px; }
    .label-human { color: #c026d3; }
    .label-assistant { color: #2563eb; }
    .text { white-space: pre-wrap; font-size: 14px; line-height: 1.5; color: #1f2937; }
    .art-box { border: 1px dashed #d1d5db; background: #f9fafb; padding: 12px; margin-bottom: 12px; border-radius: 6px; page-break-inside: avoid; }
    .art-title { font-weight: 700; font-size: 13px; color: #1f2937; }
    .art-type { font-size: 10px; color: #c026d3; font-family: monospace; margin-bottom: 8px; }
    .art-content { background: #f3f4f6; padding: 8px; border: 1px solid #e5e7eb; font-family: monospace; font-size: 11px; white-space: pre-wrap; margin:0; }
    @media print {
      body { padding: 0; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="no-print" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px; border-bottom: 2px solid #e5e7eb; padding-bottom:10px;">
    <h1 style="margin:0; font-size: 16px;">⏱️ ChatQueue AI Export</h1>
    <button id="btnPrint" style="background:#d946ef; color:#fff; border:none; border-radius:6px; padding: 8px 16px; font-weight:600; cursor:pointer; font-size:12px; outline:none;">🖨 Print / Save as PDF</button>
  </div>
  
  <h1 id="chatTitle">Chat Conversation</h1>
  <div class="meta" id="chatMeta">Exported: -</div>
  
  <div id="chatArtifacts"></div>
  <h2 style="color: #111827; border-bottom: 2px solid #e5e7eb; padding-bottom: 5px; margin-top: 30px; margin-bottom: 20px;">💬 Conversation History</h2>
  <div id="chatHistory"></div>
  
  <script src="print.js"></script>
</body>
</html>
